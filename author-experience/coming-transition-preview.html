<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coming Soon — demonstrație tranziție</title><style>*{box-sizing:border-box}html,body{margin:0;background:#061322;color:#f1d59a;font:13px Georgia;height:100%;overflow:hidden}header{height:48px;display:flex;justify-content:center;align-items:center;gap:8px}button{padding:7px 15px;border:1px solid #b99b6566;border-radius:20px;background:#112731;color:#edcc8a;cursor:pointer}button[aria-pressed=true]{background:#dcc08a;color:#122330}#box{position:absolute;top:50px;left:50%;transform-origin:top center}iframe{border:0;display:block;width:100%;height:100%}</style></head><body><header><button id="phone" aria-pressed="true">Telefon</button><button id="desktop" aria-pressed="false">Desktop</button></header><div id="box"><iframe id="demo" title="Coming Soon transition preview" allow="autoplay" src="coming-demo/index.html?library=1"></iframe></div><script>const box=document.getElementById('box');let mode='phone';function fit(){const w=mode==='phone'?390:1280,h=mode==='phone'?780:720;box.style.width=w+'px';box.style.height=h+'px';box.style.transform='translateX(-50%) scale('+Math.min(innerWidth/w,(innerHeight-52)/h)+')'}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.id;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));fit()});addEventListener('resize',fit);fit();</script></body></html>
