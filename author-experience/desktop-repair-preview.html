<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Previzualizare desktop — Welcome și About</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#061322;color:#f3d99a;font:14px Georgia,serif}header{height:58px;display:flex;gap:8px;align-items:center;justify-content:center;padding:8px}button{border:1px solid #bca16a77;border-radius:22px;color:#f7dfa7;background:#112a35;padding:9px 16px;font:14px Georgia;cursor:pointer}button[aria-pressed=true]{background:#edcf92;color:#12212a}#viewport{position:absolute;left:50%;top:58px;width:1280px;height:720px;transform-origin:top center}iframe{display:block;width:1280px;height:720px;border:0}#note{position:fixed;bottom:10px;left:12px;right:12px;text-align:center;font:12px/1.4 Arial;color:#cfc4a8}</style></head><body><header><button id="welcome" aria-pressed="true">Welcome</button><button id="author" aria-pressed="false">About the Author</button></header><div id="viewport"><iframe id="candidate" title="Desktop 1280 × 720" allow="autoplay" src="repair/index.html?preview=welcome"></iframe></div><p id="note">Previzualizare desktop 1280 × 720 · Poți roti telefonul pentru o imagine mai mare.</p><script>const box=document.querySelector('#viewport'),frame=document.querySelector('iframe');function fit(){const s=Math.min(innerWidth/1280,(innerHeight-96)/720);box.style.transform='translateX(-50%) scale('+Math.max(.1,s)+')'}fit();addEventListener('resize',fit);document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{document.querySelectorAll('header button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.src=b.id==='author'?'repair/index.html?author=1':'repair/index.html?preview=welcome'});</script></body></html>
